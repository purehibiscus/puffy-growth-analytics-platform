
name: 'puffy_platform'
version: '1.0.0'
profile: 'puffy_platform'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

models:
  puffy_platform:
    # Config indicated by + and applies to all files under models/example/
    example:
      +materialized: view

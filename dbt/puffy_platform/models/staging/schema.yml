
version: 2

models:
  - name: stg_products
    description: "Cleaned product catalogue from the synthetic Shopify dataset."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: product_name
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null

  - name: stg_customers
    description: "Cleaned synthetic customer records."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_email_hash
        data_tests:
          - unique
          - not_null
      - name: lifetime_orders
        data_tests:
          - not_null

  - name: stg_shopify_orders
    description: "Cleaned synthetic order-level transactions."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_timestamp
        data_tests:
          - not_null
      - name: net_revenue
        data_tests:
          - not_null

  - name: stg_shopify_order_items
    description: "Cleaned order-line records linked to orders and products."
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shopify_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        data_tests:
          - not_null

  - name: stg_ga4_events
    description: "Cleaned synthetic GA4 events, normalised for growth analytics."
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: event_timestamp
        data_tests:
          - not_null
      - name: event_date
        data_tests:
          - not_null
      - name: session_id
        data_tests:
          - not_null
      - name: event_name
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
